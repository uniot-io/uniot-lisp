<script src="../build/unlisp-local.js"></script>
<script>
  function timeout(ms) {
    return new Promise(resolve => setTimeout(resolve, ms))
  }

  async function asyncLispHandler(value) {
    console.log('ASK: ' + value)
    const bool = {
      '#t': true,
      '()': false
    }
    const ask = value.split(' ')
    const fn = ask[0]
    answer = '()'
    switch (fn) {
      case 'led':
        answer = ask[2]
        break
      case 'task':
        await timeout(ask[2])
        answer = ask[3]
        break
      case 'bclicked':
        answer = Math.floor(Math.random() * 2) ? '#t' : '()'
        break
      default:
        answer = '()'
        break
    }
    return answer
  }

  Module.onRuntimeInitialized = async _ => {
    const api = {
      version: Module.cwrap('version', 'number', []),
      terminate: Module.cwrap('terminate', null, []),
      lisp_evaluate: Module.cwrap(
        'lisp_evaluate',
        'number',
        ['number', 'number', 'number', 'number', 'number', 'number'],
        { async: true }
      )
    }

    console.log(`Uniot lisp version: ${api.version()}`)

    const library_ptr = Module._malloc(1024)
    const input_ptr = Module._malloc(1024)
    const output_ptr = Module._malloc(10485760)
    const handler_out_ptr = Module._malloc(64)

    Module.lisp_handler = (value, wakeUp) => {
      new Promise(async resolve => {
        resolve(await asyncLispHandler(value))
      }).then(result => {
        Module.writeAsciiToMemory(result, handler_out_ptr, false)
        wakeUp(handler_out_ptr)
      })
    }

    let error = false

    // Other things worth pointing this at, kept because they exercise different paths:
    //   "(task -1 500 '(list (print #t_pass)))"          a task that never stops
    //   "(task 10 500 '(list (print #t_pass)))"          a task with a fixed count
    //   "(task 10 500 '(list (led 0 (= (% #t_pass 2) 1))))"   driving a host callback
    const script = [
      "(define a #t)",
      "(define b ())",
      "(task 0 100 '",
      "  (list ",
      "    (print '---)",
      "    (setq b (bclicked 0))",
      "    (print (list 'a= a))",
      "    (print (list 'b= b))",
      "    (print (list 'a==b (eql a b)))",
      "  )",
      ")"
    ].join('\n')

    Module.writeAsciiToMemory(script, input_ptr, false)
    Module.writeAsciiToMemory(
      '(defjs led (i s)) (defjs bclicked (button_id))',
      library_ptr,
      false
    )

    setTimeout(() => {
      console.log('Terminating...')
      api.terminate()
    }, 5000)

    let output_size = await api.lisp_evaluate(
      8000,
      2048, // bytes of evaluation stack; 2048 is what an ESP8266 is given, 0 lifts it
      library_ptr,
      input_ptr,
      output_ptr,
      9999
    )
    if (output_size < 0) {
      error = true
      output_size *= -1
    }
    const result = Module.AsciiToString(output_ptr)

    console.log(`Script: ${script}`)
    console.log(`Result:\n${result}`)
    console.log(JSON.parse(result))
    error && console.error('^^^ ERROR OCCURRED!')

    Module._free(library_ptr)
    Module._free(input_ptr)
    Module._free(output_ptr)
    Module._free(handler_out_ptr)
}

</script>

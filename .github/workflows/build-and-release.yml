name: Build and Release WASM

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'  # Trigger on version tags like 0.2.4
  workflow_dispatch:  # Allow manual trigger
    inputs:
      version:
        description: 'Version to release (e.g., 0.2.4)'
        required: true

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '4.0.22'
      
      - name: Build WASM
        run: make wasm
      
      - name: Verify build artifacts
        run: |
          ls -lh build/
          test -f build/unlisp.js
          test -f build/unlisp.wasm
          echo "✅ Build artifacts verified"
      
      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Version: $VERSION"
      
      - name: Verify the version matches the tag
        run: make check-version VERSION=${{ steps.version.outputs.version }}

      - name: Build the release notes
        run: |
          VERSION=${{ steps.version.outputs.version }}
          {
            if ./tools/changelog-entry.sh "$VERSION" > entry.md; then
              cat entry.md
            else
              echo "::warning::No CHANGELOG.md section for $VERSION; releasing without notes."
              echo "WASM build for uniot-lisp $VERSION"
            fi
            echo
            echo "## Artifacts"
            echo "- \`unlisp.wasm\` - WebAssembly module"
            echo "- \`unlisp.js\` - JavaScript loader"
          } > release-notes.md
          echo "--- release notes ---"
          cat release-notes.md

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          body_path: release-notes.md
          files: |
            build/unlisp.wasm
            build/unlisp.js
